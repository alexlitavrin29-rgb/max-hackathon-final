  "info": {
    "title": "Точка опоры — API мини-приложения и каталога помощи",
    "version": "acceptance-2026-10-26",
    "description": "Публичный каталог помощи и отдельные сеансы MAX. Редактор не входит в публичный API. Тексты и доступность услуг требуют уточнения у организации. Источники вакансий и жилья могут быть недоступны."
